<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songs Download</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="/css/style.css?v=15">
</head>
<body>
<header>
  <h1>Songs Download</h1>
  <form id="searchForm">
    <div class="searchBox">
      <input id="q" type="search" placeholder="Suche nach Musik..." autocomplete="off" required>
    </div>
    <button type="submit" class="iconBtn" aria-label="Suchen" title="Suchen"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
    <button id="castBtn" type="button" hidden class="iconBtn" aria-label="An Chromecast senden" title="An Chromecast senden">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zM1 14v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zM1 10v2c4.97 0 9 4.03 9 9h2c0-6.08-4.92-11-11-11z"/></svg>
    </button>
    <div id="suggestions" hidden></div>
  </form>
</header>
<main>
  <div id="results" class="grid"></div>
  <div id="status"></div>
</main>
<div id="playerBar">
  <div id="nowPlaying"></div>
  <div id="castControls" hidden>
    <button id="castPlayPause" type="button" class="iconBtn" aria-label="Play/Pause" title="Play/Pause"></button>
    <button id="castStop" type="button" class="iconBtn" aria-label="Stopp" title="Stopp"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 6h12v12H6z"/></svg></button>
    <div class="castSeekWrap">
      <span id="castTimeNow">0:00</span>
      <input id="castSeek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position">
      <span id="castTimeDur">0:00</span>
    </div>
    <div class="castVolWrap">
      <input id="castVolume" type="range" min="0" max="100" value="80" step="1" aria-label="Lautstärke">
    </div>
  </div>
  <audio id="player" controls hidden></audio>
</div>
  <script src="/js/app.js?v=18"></script>
</body>
</html>
