name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (defaults to the topmost CHANGELOG.md entry)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(python3 -c 'import re; t=open("CHANGELOG.md").read(); m=re.search(r"(?m)^### (\S+)", t); print(m.group(1))')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Lint
        run: |
          SRC=src/usr/local/emhttp/plugins/unraid-unzip
          bash -n bin/build.sh
          bash -n bin/generate-pages.sh
          bash -n "$SRC/scripts/job-runner.sh"
          bash -n "$SRC/scripts/merge-tree.sh"
          bash -n "$SRC/scripts/normalize-excludes.sh"
          node --check "$SRC/js/unraid-unzip.js"
          php -l "$SRC/include/api.php"
          php -l "$SRC/include/lib.php"
          php -l "$SRC/scripts/job-helper.php"

      - name: Tests
        run: |
          bash tests/run-tests.sh
          bash tests/test-exclude-normalization.sh
          bash tests/verify-7z-checksum.sh

      - name: Build package
        id: build
        run: |
          bash bin/build.sh --version "${{ steps.ver.outputs.version }}" --out-dir dist
          BUILT_SHA="$(sha256sum "dist/unraid-unzip-${{ steps.ver.outputs.version }}-noarch-1.txz" | awk '{print $1}')"
          echo "sha=$BUILT_SHA" >> "$GITHUB_OUTPUT"
          echo "built sha: $BUILT_SHA"

      - name: Sanity-check generated .plg (matches the build)
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SHA="${{ steps.build.outputs.sha }}"
          bash bin/generate-pages.sh --version "$VERSION" --sha256 "$SHA" --out /tmp/uuz-check
          PKG="unraid-unzip-${VERSION}-noarch-1.txz"
          grep -q "unraid-unzip-${VERSION}-noarch-1.txz" /tmp/uuz-check/unraid-unzip.plg
          grep -q "<SHA256>${SHA}</SHA256>" /tmp/uuz-check/unraid-unzip.plg
          grep -q 'https://raw.githubusercontent.com/h4de5/unraid-plugins/main/unraid-unzip.plg' /tmp/uuz-check/unraid-unzip.plg
          echo "generated .plg is consistent with the build"

      - name: Release body (changelog for this version)
        id: body
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BODY="$(python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(r'(?m)^### ' + re.escape(version) + r'\s*$(.*?)(?=^### |\Z)', text, re.S | re.M)
          if not m:
              sys.exit(f"no changelog entry for {version} (add one to CHANGELOG.md before tagging)")
          body = "### " + version + "\n" + m.group(1).strip()
          print(body.strip())
          PY
          )"
          printf '%s\n' "$BODY" > body.md
          echo "release body:"; cat body.md
        shell: bash

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            TAG_NAME="v${{ steps.ver.outputs.version }}"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag: $TAG_NAME"

      - name: Publish GitHub Release (.txz)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: unraid-unzip ${{ steps.ver.outputs.version }}
          body_path: body.md
          files: |
            dist/unraid-unzip-${{ steps.ver.outputs.version }}-noarch-1.txz
          draft: false
          prerelease: false

      - name: Generate pages (manifest + landing)
        run: |
          bash bin/generate-pages.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --sha256 "${{ steps.build.outputs.sha }}" \
            --out pages

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      # The canonical install manifest lives at the REPO ROOT (unraid-unzip.plg,
      # tracked in git) so the stable raw URL (raw.githubusercontent.com/.../main/
      # unraid-unzip.plg) and the CA wrapper always resolve to the latest release.
      # After the Release exists, regenerate it from this build's SHA and commit it
      # to main. This is the pipeline updating its own manifest - not a hand commit.
      - name: Commit updated root manifest to main
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SHA="${{ steps.build.outputs.sha }}"
          bash bin/generate-pages.sh \
            --version "$VERSION" \
            --sha256 "$SHA" \
            --out /tmp/uuz-root
          cp /tmp/uuz-root/unraid-unzip.plg new-plg.xml
          T=/tmp/uuz-main
          rm -rf "$T"
          git clone --depth 1 --branch main https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git "$T"
          cp new-plg.xml "$T/unraid-unzip.plg"
          git -C "$T" config user.name  "github-actions[bot]"
          git -C "$T" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git -C "$T" diff --quiet -- unraid-unzip.plg; then
            git -C "$T" add unraid-unzip.plg
            git -C "$T" commit -m "chore(release): bump root manifest to ${VERSION}"
            git -C "$T" push
            echo "root manifest on main bumped to ${VERSION}"
          else
            echo "root manifest on main already at ${VERSION}"
          fi
          rm -f new-plg.xml

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4